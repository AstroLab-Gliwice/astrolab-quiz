<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroLab Quiz - Rejestracja</title>
  <link rel="shortcut icon" href="/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .card {
      background: var(--card);
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .05);
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      animation: fadeIn .5s ease-out;
    }

    h1 {
      font-weight: 700;
      font-size: 22px;
      color: var(--primary);
      text-align: center;
    }

    input {
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-size: 16px;
      outline: none;
      width: 100%;
      transition: border-color .2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #93b8d4;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: not-allowed;
      transition: background .2s;
    }

    button.active {
      background: var(--primary);
      cursor: pointer;
    }

    button.active:hover {
      background: var(--accent);
    }

    .info-msg {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 10px 14px;
      color: #92400e;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      color: #b91c1c;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo"><img src="/logo.svg" alt="AstroLab" /></div>

  <div class="card">
    <h1>Rozpocznij grę</h1>
    <div class="error-msg" id="errorMsg"></div>
    <input type="text" id="nickInput" placeholder="Twój nickname" maxlength="20" autocomplete="off" />
    <div class="info-msg">
      ⚠️ <strong>Uwaga:</strong> Konta z nieodpowiednimi lub wulgarnymi nickami będą usuwane z rankingu.
    </div>
    <button id="submitBtn" disabled>Zatwierdź</button>
  </div>

  <footer>&copy; 2026 AstroLab &middot; Made with &hearts;</footer>

  <script>
    const returnTo   = new URLSearchParams(location.search).get("returnTo") || "/";
    const nickInput  = document.getElementById("nickInput");
    const submitBtn  = document.getElementById("submitBtn");
    const errorMsg   = document.getElementById("errorMsg");

    function setActive(active) {
      submitBtn.disabled = !active;
      submitBtn.classList.toggle("active", active);
    }

    nickInput.addEventListener("input", () => setActive(nickInput.value.trim() !== ""));
    document.addEventListener("keydown", (e) => { if (e.key === "Enter" && !submitBtn.disabled) register(); });
    submitBtn.addEventListener("click", register);

    async function register() {
      const nick = nickInput.value.trim();
      if (!nick) return;

      setActive(false);
      errorMsg.style.display = "none";

      try {
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nick, returnTo }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || "Wystąpił błąd. Spróbuj ponownie.";
          errorMsg.style.display = "block";
          setActive(nick !== "");
          return;
        }

        location.replace(data.redirectTo);
      } catch {
        errorMsg.textContent = "Problem z połączeniem. Sprawdź internet i spróbuj ponownie.";
        errorMsg.style.display = "block";
        setActive(nickInput.value.trim() !== "");
      }
    }
  </script>
</body>
</html>
