<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroLab Quiz - Panel Administracyjny</title>
  <link rel="shortcut icon" href="/logo/astrolab-main.svg" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="stylesheet" href="/styles/admlog.css">
</head>
<body>
  <div class="card">
    <img src="/logo/astrolab-halloween.svg" alt="AstroLab" style="width:64px;height:64px" />
    <div class="lock">🔐</div>
    <h1>Panel administracyjny</h1>
    <div class="error" id="err">Nieprawidłowe hasło.</div>
    <div class="pwd-wrapper">
      <input type="password" id="pwd" placeholder="Wprowadź hasło..." autofocus />
      <button class="pwd-toggle" id="togglePwd" type="button" aria-label="Pokaż/ukryj hasło">
        <img id="eyeIcon" src="/icons/vison_black.svg" />
      </button>
    </div>
    <button class="btn" id="btn">Zaloguj się!</button>
    <a href="/" style="font-size:13px;color:var(--muted);text-decoration:none"><span class="ultra-ultra-ultra-small material-symbols-outlined">
arrow_back
</span> Powrót na stronę główną</a>
  </div>

  <script src="/scripts/admlog.js"></script>
</body>
</html>
