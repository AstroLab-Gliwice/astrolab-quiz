<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroLab Quiz - Rejestracja</title>
  <link rel="shortcut icon" href="/logo/astrolab-main.svg" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="stylesheet" href="/styles/register.css">
  <link rel="stylesheet" href="/styles/astrolloween-seasonal.css">
</head>
<body>
  <div class="logo"><img src="/logo/astrolab-halloween.svg" alt="AstroLab" /></div>

  <div class="card">
    <h1>Rozpocznij grę</h1>
    <div class="error-msg" id="errorMsg"></div>
    <input type="text" id="nickInput" placeholder="Twoje imię i nazwisko" maxlength="20" autocomplete="off" />
    <div class="info-msg">
      ⚠️ <strong>Uwaga:</strong> Konta z nieodpowiednimi lub wulgarnymi nickami będą usuwane z rankingu. W ramach konkursu Astrolloween, proszę podać imię i nazwisko.
    </div>
    <button id="submitBtn" disabled>Zatwierdź</button>
  </div>

  <footer>&copy; 2026 AstroLab &middot; Made with &hearts;</footer>

  <script src="/scripts/register.js"></script>
</body>
</html>
