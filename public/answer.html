<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroLab Quiz - Wynik</title>
  <link rel="shortcut icon" href="/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .info-card { padding: 36px 24px; }
    .info-card h1 { font-size: 23px; margin-top: 6px; }
    .info-card .big-icon { font-size: 52px; }
    .info-card .btn { margin-top: 5px; }
    @media (min-width: 400px) { body { padding: 40px; } }
  </style>
</head>
<body>
  <div class="logo"><img src="/logo.svg" alt="AstroLab" /></div>
  <div class="info-card" id="card"></div>
  <footer>&copy; 2026 AstroLab &middot; Made with &hearts;</footer>

  <script>
    const p = new URLSearchParams(location.search);
    const suffix = `<p style="margin-top:-10px">Szukaj kolejnego kodu QR!</p><a href="/" class="btn">← Wróć na stronę główną</a>`;

    const content = p.get("alreadyAnswered") === "1"
      ? `<div class="big-icon">⚠️</div><h1>Już tu byłeś!</h1><p>Już próbowałeś odpowiedzieć na to pytanie.</p>${suffix}`
      : p.get("timeout") === "1"
      ? `<div class="big-icon">⏰</div><h1>Czas minął!</h1><p>Nie zdążyłeś odpowiedzieć na czas.</p>${suffix}`
      : `<div class="big-icon">✅</div><h1 style="margin-bottom:10px">Odpowiedź została wysłana!</h1>${suffix}`;

    document.getElementById("card").innerHTML = content;
  </script>
</body>
</html>
