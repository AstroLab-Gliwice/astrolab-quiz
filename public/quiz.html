<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroLab Quiz - Pytanie</title>
  <link rel="shortcut icon" href="/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    main {
      width: 100%;
      max-width: 400px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .panel {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .05);
      max-width: 400px;
      width: 100%;
      animation: fadeIn .5s ease-out;
    }

    /* ── Start card ──────────────────────────────────────────── */
    .start-card {
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .question-badge {
      background: #eef4f9;
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
    }

    .big-number {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -2px;
    }

    .start-label { font-size: 15px; color: var(--muted); line-height: 1.5; }

    /* ── Quiz card ───────────────────────────────────────────── */
    .quiz-card {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      /* Wyłączenie zaznaczania tekstu i menu kontekstowego (anty-kopiowanie) */
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .player-bar {
      display: flex;
      align-items: center;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .player-bar .nick { font-weight: 700; color: var(--primary); font-size: 14px; }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .question-number {
      font-weight: 600;
      font-size: 13px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .question-text { font-weight: 700; font-size: 19px; line-height: 1.45; }

    .divider { height: 1px; background: #f3f4f6; }

    /* ── Answer options ──────────────────────────────────────── */
    .answers { display: flex; flex-direction: column; gap: 10px; }

    .answer {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--bg);
      border: 2px solid var(--border);
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
    }

    .answer::before {
      content: attr(data-letter);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--border);
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      transition: all .15s;
    }

    .answer:hover:not(.disabled):not(.selected) { border-color: #93b8d4; background: #eef4f9; }
    .answer:hover:not(.disabled):not(.selected)::before { background: #d0e6f5; color: var(--accent); }

    .answer.selected { border-color: var(--primary); background: #deeaf3; }
    .answer.selected::before { background: var(--primary); color: #fff; }

    .answer.disabled { cursor: default; opacity: .7; }

    /* ── Submit button ───────────────────────────────────────── */
    .submit-btn {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #93b8d4;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: not-allowed;
      transition: background .2s;
      width: 100%;
    }

    .submit-btn.active            { background: var(--primary); cursor: pointer; }
    .submit-btn.active:hover      { background: var(--accent); }

    /* ── Already answered card ───────────────────────────────── */
    .info-card { padding: 36px 24px; }
    .info-card h1 { font-size: 23px; margin-top: 6px; }
    .info-card .big-icon { font-size: 52px; }
    .info-card .btn { margin-top: 5px; }

    @media (min-width: 400px) { body { padding: 40px 20px; } }

    /* ── Timer ───────────────────────────────────────────────── */
    .timer-wrap { display: flex; align-items: center; gap: 10px; }

    .timer-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      min-width: 36px;
      text-align: right;
      flex-shrink: 0;
      transition: color .3s;
    }

    .timer-bar-track {
      flex: 1;
      height: 8px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--primary);
      transition: background .3s;
      will-change: width;
    }

    .timer-label.warning { color: #d97706; }
    .timer-bar-fill.warning { background: #d97706; }
    .timer-label.danger { color: #dc2626; }
    .timer-bar-fill.danger { background: #dc2626; }

    .btn { margin-top: 13px; }
  </style>
</head>
<body>
  <div class="logo"><img src="/logo.svg" alt="AstroLab" /></div>

  <main id="mainContent"></main>

  <footer>&copy; 2026 AstroLab &middot; Made with &hearts;</footer>

  <script>
    const questionId = location.pathname.split("/").filter(Boolean).pop();
    const mainEl     = document.getElementById("mainContent");
    const LETTERS    = ["A", "B", "C", "D", "E", "F"];

    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── Load ──────────────────────────────────────────────────
    async function loadQuestion() {
      mainEl.innerHTML = `<p style="color:var(--muted);padding:2rem;text-align:center">⏳ Ładowanie...</p>`;

      try {
        const res  = await fetch(`/quiz/api/${questionId}`, { headers: { Accept: "application/json" } });
        const serverDate = res.headers.get("Date");
        const clockOffset = serverDate ? Date.now() - new Date(serverDate).getTime() : 0;
        const data = await res.json();

        if (res.status === 401) {
          location.replace(`/register?returnTo=${encodeURIComponent(location.pathname)}`);
          return;
        }
        if (!res.ok) {
          mainEl.innerHTML = `<p style="color:var(--muted);padding:2rem;text-align:center">Błąd: ${data.error}</p>`;
          return;
        }
        if (data.alreadyAnswered) {
          renderAlreadyAnswered();
          return;
        }

        if (data.startedAt) {
          const elapsed = (Date.now() - clockOffset - data.startedAt) / 1000;
          if (elapsed >= data.timelimit) {
            submitAnswer("__TIMEOUT__");
          } else {
            renderQuestion({ question: data.question, player: data.player, timelimit: data.timelimit, startedAt: data.startedAt, clockOffset });
          }
        } else {
          renderStart({ ...data, clockOffset });
        }
      } catch {
        mainEl.innerHTML = `<p style="color:var(--muted);padding:2rem;text-align:center">Błąd połączenia z serwerem.</p>`;
      }
    }

    // ── Start screen ──────────────────────────────────────────
    function renderStart({ question, player, timelimit, clockOffset = 0 }) {
      mainEl.innerHTML = `
        <div class="panel start-card">
          <div class="question-badge">Pytanie</div>
          <div class="big-number">#${question.id}</div>
          <p class="start-label">👤 <strong>${esc(player.nick)}</strong></p>
          <div style="background:#eef4f9;border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--accent);font-weight:600;">
            <span style="font-size:22px">⏱️</span>
            <span>Na odpowiedź masz <strong>${timelimit} sekund</strong></span>
          </div>
          <button class="btn" id="startBtn">Rozpocznij ▶</button>
        </div>`;

      document.getElementById("startBtn").addEventListener("click", async () => {
        const btn = document.getElementById("startBtn");
        btn.disabled = true;
        btn.textContent = "⏳ Startuję...";

        try {
          const res  = await fetch(`/quiz/${questionId}/start`, { method: "POST" });
          const data = await res.json();
          const startServerDate = res.headers.get("Date");
          const startClockOffset = startServerDate ? Date.now() - new Date(startServerDate).getTime() : clockOffset;

          if (res.status === 409) { location.reload(); return; }
          if (!res.ok) { btn.disabled = false; btn.textContent = "Rozpocznij ▶"; return; }

          renderQuestion({ question, player, timelimit, startedAt: data.startedAt, clockOffset: startClockOffset });
        } catch {
          btn.disabled = false;
          btn.textContent = "Rozpocznij ▶";
          alert("Błąd połączenia. Spróbuj ponownie.");
        }
      });
    }

    // ── Question screen ───────────────────────────────────────
    function renderQuestion({ question, player, timelimit, startedAt, clockOffset = 0 }) {
      mainEl.innerHTML = `
        <div class="panel quiz-card">
          <div class="player-bar">👤 <span class="nick">${esc(player.nick)}</span></div>
          <div>
            <div class="question-meta">
              <span class="question-number">Pytanie #${question.id}</span>
            </div>
            <div class="question-text">${esc(question.text)}</div>
          </div>
          <div class="timer-wrap">
            <div class="timer-bar-track">
              <div class="timer-bar-fill" id="timerFill" style="width:100%"></div>
            </div>
            <div class="timer-label" id="timerLabel">${timelimit}s</div>
          </div>
          <div class="divider"></div>
          <div class="answers" id="answers">
            ${question.options.map((opt, i) =>
              `<div class="answer" data-letter="${LETTERS[i] || i + 1}">${esc(opt)}</div>`
            ).join("")}
          </div>
          <button class="submit-btn" id="submitBtn" disabled>Zatwierdź odpowiedź</button>
        </div>`;

      let selectedAnswer = null;
      const answersEl = document.getElementById("answers");
      const submitBtn = document.getElementById("submitBtn");
      const timerFill = document.getElementById("timerFill");
      const timerLabel = document.getElementById("timerLabel");

      answersEl.addEventListener("click", (e) => {
        const el = e.target.closest(".answer");
        if (!el || el.classList.contains("disabled")) return;
        answersEl.querySelectorAll(".answer").forEach((a) => a.classList.remove("selected"));
        el.classList.add("selected");
        selectedAnswer = el.textContent.trim();
        submitBtn.classList.add("active");
        submitBtn.disabled = false;
      });

      submitBtn.addEventListener("click", () => {
        if (selectedAnswer) submitAnswer(selectedAnswer);
      });

      // ── Timer (rAF — smooth, server-based) ───────────────────
      let timerExpired = false;
      let lastDisplayedSecond = null;

      function timerTick() {
        const elapsed   = (Date.now() - clockOffset - startedAt) / 1000;
        const remaining = Math.max(0, timelimit - elapsed);
        const pct       = (remaining / timelimit) * 100;

        timerFill.style.width = pct + "%";

        const displaySec = Math.ceil(remaining);
        if (displaySec !== lastDisplayedSecond) {
          lastDisplayedSecond = displaySec;
          timerLabel.textContent = displaySec + "s";
        }

        const warning = remaining <= timelimit * 0.4;
        const danger  = remaining <= timelimit * 0.2;
        timerFill.classList.toggle("warning", warning && !danger);
        timerFill.classList.toggle("danger",  danger);
        timerLabel.classList.toggle("warning", warning && !danger);
        timerLabel.classList.toggle("danger",  danger);

        if (remaining <= 0) {
          timerFill.style.width = "0%";
          timerLabel.textContent = "0s";
          if (!timerExpired) {
            timerExpired = true;
            answersEl.querySelectorAll(".answer").forEach((a) => a.classList.add("disabled"));
            submitBtn.disabled = true;
            submitBtn.classList.remove("active");
            submitBtn.textContent = "⏰ Zapisywanie...";
            submitAnswer("__TIMEOUT__");
          }
          return;
        }

        requestAnimationFrame(timerTick);
      }

      requestAnimationFrame(timerTick);
    }

    // ── Submit ────────────────────────────────────────────────
    async function submitAnswer(answer) {
      const isTimeout = answer === "__TIMEOUT__";
      const submitBtn = document.getElementById("submitBtn");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = isTimeout ? "⏰ Zapisywanie..." : "Sprawdzam...";
      }

      try {
        const res  = await fetch(`/quiz/${questionId}/answer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answer }),
        });
        const data = await res.json();

        if (res.status === 409) { location.replace("/answer.html?alreadyAnswered=1"); return; }

        document.querySelectorAll(".answer").forEach((el) => el.classList.add("disabled"));
        if (submitBtn) submitBtn.classList.remove("active");

        const wasTimeout = isTimeout || data.timedOut;
        if (submitBtn) submitBtn.textContent = wasTimeout ? "⏰ Czas minął!" : "Wysyłanie...";
        setTimeout(() => location.replace(wasTimeout ? "/answer.html?timeout=1" : "/answer.html"), 600);
      } catch {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = isTimeout ? "⏰ Czas minął!" : "Zatwierdź odpowiedź";
          if (!isTimeout) {
            submitBtn.classList.add("active");
            alert("Błąd połączenia. Spróbuj ponownie.");
          }
        }
      }
    }

    // ── Already answered ──────────────────────────────────────
    function renderAlreadyAnswered() {
      mainEl.innerHTML = `
        <div class="info-card">
          <div class="big-icon">⚠️</div>
          <h1>Już tu byłeś!</h1>
          <p>Już próbowałeś odpowiedzieć na to pytanie.</p>
          <p style="margin-top:-10px">Szukaj kolejnego kodu QR!</p>
          <a href="/" class="btn">← Wróć na stronę główną</a>
        </div>`;
    }

    loadQuestion();
  </script>
</body>
</html>
